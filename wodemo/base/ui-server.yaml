apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui-server
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: ui-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui-server
          image: ghcr.io/clearmeasure-aisf-sample-apps/wodemo/ui-server
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wodemo-config
                  key: DB_NAME
            - name: DB_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
            - name: ConnectionStrings__SqlConnectionString
              value: Server=tcp:mssql.wodemo-data.svc.cluster.local,1433;Database=$(DB_NAME);User ID=$(DB_APP_USERNAME);Password=$(DB_APP_PASSWORD);Encrypt=True;TrustServerCertificate=True;
          envFrom:
            - configMapRef:
                name: wodemo-config
            - secretRef:
                name: wodemo-app
                optional: true
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nsb-diagnostics
              mountPath: /app/.diagnostics
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: nsb-diagnostics
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-server
  labels:
    app.kubernetes.io/name: ui-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

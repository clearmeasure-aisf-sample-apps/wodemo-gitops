apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: message-handler
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: message-handler
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: acrwodemoce304.azurecr.io/wodemo/worker
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: wodemo-config
                  key: DB_NAME
            - name: DB_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
            - name: ConnectionStrings__SqlConnectionString
              value: Server=tcp:mssql.wodemo-data.svc.cluster.local,1433;Database=$(DB_NAME);User ID=$(DB_APP_USERNAME);Password=$(DB_APP_PASSWORD);Encrypt=True;TrustServerCertificate=True;
          envFrom:
            - configMapRef:
                name: wodemo-config
            - secretRef:
                name: wodemo-app
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nsb-diagnostics
              mountPath: /app/.diagnostics
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: nsb-diagnostics
          emptyDir:
            sizeLimit: 16Mi

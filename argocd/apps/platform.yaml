# Cluster add-ons of the wodemo demo: the ingress controller and the shared SQL Server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          replicaCount: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          service:
            annotations:
              # Azure load balancer health probe for the HTTP port.
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          admissionWebhooks:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wodemo-sqlserver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/clearmeasure-aisf-sample-apps/wodemo-gitops.git
    targetRevision: main
    path: data/sqlserver
  destination:
    server: https://kubernetes.default.svc
    namespace: wodemo-data
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
